apiVersion: cluster.x-k8s.io/v1beta2
kind: Cluster
metadata:
  name: capi-quickstart
  namespace: default
spec:
  clusterNetwork:
    pods:
      cidrBlocks:
      - 192.168.0.0/16
    serviceDomain: cluster.local
    services:
      cidrBlocks:
      - 10.128.0.0/12
  topology:
    classRef:
      name: quick-start
    controlPlane:
      replicas: 1
    variables:
    - name: imageRepository
      value: ""
    - name: etcdImageTag
      value: ""
    - name: coreDNSImageTag
      value: ""
    - name: podSecurityStandard
      value:
        audit: restricted
        enabled: true
        enforce: baseline
        warn: restricted
    version: v1.34.0
    workers:
      machineDeployments:
      - class: default-worker
        name: md-0
        replicas: 1
        metadata:
          labels:
            slinky.slurm.net/node-type: controller
      machinePools:
      - class: default-worker
        name: mp-0
        metadata:
          annotations:
            cluster.x.k8s.io/cluster-api-autoscaler-node-group-min-size: '1'
          labels:
            slinky.slurm.net/node-type: compute
