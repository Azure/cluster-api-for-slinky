# =============================================================================
# HPC image-validation cluster — CAPZ + kubeadm, Headnode + worker VMSS.
# =============================================================================
#
# DROP-IN for the imperative hpc-image-val provisioning:
#     create_resources.sh + create_virtualmachine.sh   →  kubectl apply -f this
#     run_cleanup.sh (az group delete)                 →  kubectl delete cluster caps-val
#
# Topology (HPC vocabulary):
#   * Headnode  = k8s control plane (1 VM, AzureMachineTemplate) — runs the
#                 API server + will host the Slurm controller (slurm-operator).
#   * Workers   = VMSS (AzureMachinePool, Uniform) — the compute nodes that
#                 BOOT THE azhpc-images SIG image under validation and run the
#                 MPI / NCCL / RCCL / SuperBench jobs.
#
# Apply on the MANAGEMENT kind cluster on the dev VM (vm-capz-mi-dev):
#     kubectl --context kind-mgmt-<hex> apply -f hpc-image-val-cluster.yaml
#
# -----------------------------------------------------------------------------
# THINGS TO WIRE FROM THE PIPELINE  (placeholders marked <<...>> below)
# -----------------------------------------------------------------------------
#   * location / worker vmSize  ← global scheduler outputs
#       RESOURCE_GRP_LOCATION  → spec.location
#       GPU_SIZE_OPTION        → worker template.vmSize  (e.g. Standard_ND96asr_v4)
#   * worker image version      ← build output (manifest.json IMAGE_VERSION),
#       e.g. "2606.19.2872"     → AzureMachinePool image.computeGallery.version
#   * VNet / subnets            ← reusing phase-1 VNet vm-capz-mi-devVNET in
#       rg-capz-mi-dev2 (10.0.0.0/16); CAPZ creates the cp/node subnets below.
#   * UAMI providerID           ← reusing phase-1 UAMI rg-capz-mi-dev2 (already
#       has CCM / disks / LB rights; same UAMI the mgmt VM uses).
#
# -----------------------------------------------------------------------------
# KEY INTEGRATION GOTCHA — k8s toolchain on the azhpc image
# -----------------------------------------------------------------------------
# The CAPI community-gallery image bakes in kubeadm/kubelet/containerd at the
# pinned k8s version; the azhpc-images do NOT. So:
#   * The HEADNODE uses the default CAPI image (omit `image:` → CAPZ picks
#     capi-ubun2-2404 / v1.36.1) so the control plane comes up reliably.
#   * The WORKERS boot the azhpc image (the artifact we are validating) and
#     install the kubelet/kubeadm toolchain at runtime via preKubeadmCommands.
#   Long-term: bake the k8s toolchain into the azhpc image so workers join
#   without the runtime install step.
# =============================================================================

---
apiVersion: cluster.x-k8s.io/v1beta1
kind: Cluster
metadata:
  name: caps-val
  namespace: default
spec:
  clusterNetwork:
    pods:
      cidrBlocks:
        - 192.168.0.0/16
  controlPlaneRef:
    apiVersion: controlplane.cluster.x-k8s.io/v1beta1
    kind: KubeadmControlPlane
    name: caps-val-control-plane
  infrastructureRef:
    apiVersion: infrastructure.cluster.x-k8s.io/v1beta1
    kind: AzureCluster
    name: caps-val

---
apiVersion: infrastructure.cluster.x-k8s.io/v1beta1
kind: AzureCluster
metadata:
  name: caps-val
  namespace: default
spec:
  identityRef:
    apiVersion: infrastructure.cluster.x-k8s.io/v1beta1
    kind: AzureClusterIdentity
    name: cluster-identity
    namespace: default
  location: westus2                              # <<RESOURCE_GRP_LOCATION>> (pinned from global scheduler)
  resourceGroup: rg-capz-mi-dev2                 # reuse phase-1 RG (already Owner-tagged → satisfies VM policy)
  subscriptionID: d2c9544f-4329-4642-b73d-020e7fef844f   # HPCScrub1
  networkSpec:
    # BYO the phase-1 VNet so the kind mgmt cluster (on the dev VM, in
    # vm-capz-mi-devSubnet 10.0.0.0/24) has same-VNet line of sight to the
    # internal API server. CAPZ creates the cp/node subnets below — 10.0.1.0/24
    # and 10.0.2.0/24 are free in the 10.0.0.0/16 space.
    vnet:
      name: vm-capz-mi-devVNET
      resourceGroup: rg-capz-mi-dev2
    # Internal API LB => private IP reachable from the mgmt VM over the VNet
    # (intra-VNet 6443 is not corp-egress filtered; the public endpoint is).
    apiServerLB:
      type: Internal
      frontendIPs:
        - name: caps-val-internal-lb-frontend
          privateIP: 10.0.1.100                  # <<inside the cp-subnet range>>
    subnets:
      - name: caps-val-cp-subnet
        role: control-plane
        cidrBlocks:
          - 10.0.1.0/24
        # NAT gateway for CP egress — the corp env has no default outbound.
        natGateway:
          name: caps-val-cp-natgw
      - name: caps-val-node-subnet
        role: node
        cidrBlocks:
          - 10.0.2.0/24
  additionalTags:
    Owner: t-hernandezc                          # satisfies the Owner-tag-on-RG policy
    Purpose: hpc-image-val

# =============================================================================
# HEADNODE — k8s control plane (default CAPI image; reliable kubeadm bootstrap)
# =============================================================================
---
apiVersion: controlplane.cluster.x-k8s.io/v1beta1
kind: KubeadmControlPlane
metadata:
  name: caps-val-control-plane
  namespace: default
spec:
  replicas: 1
  version: v1.36.1
  machineTemplate:
    infrastructureRef:
      apiVersion: infrastructure.cluster.x-k8s.io/v1beta1
      kind: AzureMachineTemplate
      name: caps-val-control-plane
  kubeadmConfigSpec:
    clusterConfiguration:
      controllerManager:
        extraArgs:
          allocate-node-cidrs: "false"
          cloud-provider: external
          cluster-name: caps-val
    files:
      - contentFrom:
          secret:
            name: caps-val-control-plane-azure-json
            key: control-plane-azure.json
        owner: root:root
        path: /etc/kubernetes/azure.json
        permissions: "0644"
    initConfiguration:
      nodeRegistration:
        name: '{{ ds.meta_data["local_hostname"] }}'
        kubeletExtraArgs:
          cloud-provider: external
    joinConfiguration:
      nodeRegistration:
        name: '{{ ds.meta_data["local_hostname"] }}'
        kubeletExtraArgs:
          cloud-provider: external

---
apiVersion: infrastructure.cluster.x-k8s.io/v1beta1
kind: AzureMachineTemplate
metadata:
  name: caps-val-control-plane
  namespace: default
spec:
  template:
    spec:
      # No `image:` → CAPZ defaults to the CAPI community gallery image for
      # v1.36.1 (capi-ubun2-2404), which has the kubeadm toolchain pre-baked.
      vmSize: Standard_D4s_v5                    # headnode: CP + slurm controller
      osDisk:
        diskSizeGB: 128
        osType: Linux
      identity: UserAssigned
      userAssignedIdentities:
        - providerID: azure:///subscriptions/d2c9544f-4329-4642-b73d-020e7fef844f/resourceGroups/rg-capz-mi-dev2/providers/Microsoft.ManagedIdentity/userAssignedIdentities/rg-capz-mi-dev2
      sshPublicKey: 
      # AzSecPack (Geneva/Azure Security Pack) auto-config — required on the
      # headnode VM too, not just the workers.
      additionalTags:
        Owner: t-hernandezc
        Purpose: hpc-image-val
        AzSecPackAutoConfigReady: "true"

# =============================================================================
# WORKERS — VMSS booting the azhpc-images SIG image under validation
# =============================================================================
---
apiVersion: cluster.x-k8s.io/v1beta1
kind: MachinePool
metadata:
  name: caps-val-mp-0
  namespace: default
spec:
  clusterName: caps-val
  replicas: 1                                    # 1-worker sketch; bump for 16-node ccl_mpi
  template:
    spec:
      clusterName: caps-val
      version: v1.36.1
      bootstrap:
        configRef:
          apiVersion: bootstrap.cluster.x-k8s.io/v1beta1
          kind: KubeadmConfig
          name: caps-val-mp-0
      infrastructureRef:
        apiVersion: infrastructure.cluster.x-k8s.io/v1beta1
        kind: AzureMachinePool
        name: caps-val-mp-0

---
apiVersion: infrastructure.cluster.x-k8s.io/v1beta1
kind: AzureMachinePool
metadata:
  name: caps-val-mp-0
  namespace: default
spec:
  location: westus2                              # <<RESOURCE_GRP_LOCATION>>
  # orchestrationMode omitted => Uniform (default). Flexible is a later step.
  identity: UserAssigned
  userAssignedIdentities:
    - providerID: azure:///subscriptions/d2c9544f-4329-4642-b73d-020e7fef844f/resourceGroups/rg-capz-mi-dev2/providers/Microsoft.ManagedIdentity/userAssignedIdentities/rg-capz-mi-dev2
  template:
    vmSize: Standard_ND96asr_v4                  # <<GPU_SIZE_OPTION>> from global scheduler
    # >>> THE INTEGRATION POINT: boot the validated azhpc image, not Ubuntu <<<
    image:
      computeGallery:
        subscriptionID: d2c9544f-4329-4642-b73d-020e7fef844f
        resourceGroup: azhpc-images-rg
        gallery: AzHPCImageReleaseCandidates
        name: UbuntuHPC-24.04-gen2               # image def (GPU SKU suffixed for GPU images)
        version: "2606.19.2872"                  # latest UbuntuHPC-24.04-gen2 (2026-06-19); set per build
    osDisk:
      diskSizeGB: 64
      managedDisk:
        storageAccountType: Premium_LRS
      osType: Linux
    sshPublicKey: 
  additionalTags:
    Owner: t-hernandezc
    Purpose: hpc-image-val
    AzSecPackAutoConfigReady: "true"

---
apiVersion: bootstrap.cluster.x-k8s.io/v1beta1
kind: KubeadmConfig
metadata:
  name: caps-val-mp-0
  namespace: default
spec:
  files:
    - contentFrom:
        secret:
          name: caps-val-mp-0-azure-json
          key: worker-node-azure.json
      owner: root:root
      path: /etc/kubernetes/azure.json
      permissions: "0644"
  # The azhpc image has no kubeadm toolchain — install it before kubeadm join.
  # (Pin to the k8s minor that matches the control plane: v1.36.) Remove this
  # block once the toolchain is baked into the azhpc image.
  preKubeadmCommands:
    - mkdir -p /etc/apt/keyrings
    - curl -fsSL https://pkgs.k8s.io/core:/stable:/v1.36/deb/Release.key | gpg --dearmor -o /etc/apt/keyrings/kubernetes-apt-keyring.gpg
    - echo "deb [signed-by=/etc/apt/keyrings/kubernetes-apt-keyring.gpg] https://pkgs.k8s.io/core:/stable:/v1.36/deb/ /" > /etc/apt/sources.list.d/kubernetes.list
    - apt-get update
    - apt-get install -y --allow-downgrades containerd kubelet=1.36.1-1.1 kubeadm=1.36.1-1.1
    - systemctl enable --now containerd
  joinConfiguration:
    nodeRegistration:
      name: '{{ ds.meta_data["local_hostname"] }}'
      kubeletExtraArgs:
        cloud-provider: external

# =============================================================================
# DAY-2 (run on the WORKLOAD cluster after the headnode is Ready) — same as the
# phase-1 self-managed path; nodes stay NotReady/tainted until these land:
#   1. cloud-provider-azure (CCM/CNM)   — initializes nodes, LB, disks
#   2. Calico CNI                        — pod networking
# Then overlay Slurm:
#   3. helm install slurm-operator (slinkyproject) + a NodeSet binding the VMSS
#      workers as Slurm compute nodes → run-tests.sh targets them as the
#      headnode+workers HPC cluster.
# =============================================================================
