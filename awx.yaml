extraDeploy:
  # TODO: this is a local kind-specific quick hack to pass through the kubernetes credentials.
  # proper credential management needs to be implemented for cloud providers.
  - apiVersion: v1
    kind: PersistentVolume
    metadata:
      name: awx-kubeconfig-volume
    spec:
      accessModes:
        - ReadWriteOnce
      persistentVolumeReclaimPolicy: Retain
      capacity:
        storage: 1Gi
      storageClassName: awx-kubeconfig-volume
      hostPath:
        path: "/root/.kube"
  - apiVersion: v1
    kind: PersistentVolumeClaim
    metadata:
      name: awx-kubeconfig-claim
    spec:
      accessModes:
        - ReadWriteOnce
      volumeMode: Filesystem
      resources:
        requests:
          storage: 1Gi
      storageClassName: awx-kubeconfig-volume

AWX:
  enabled: true
  spec:
    projects_persistence: true
    service_type: nodeport
    nodeport_port: 32000
    extra_volumes: |
      - name: awx-kubeconfig-volume
        persistentVolumeClaim:
          claimName: awx-kubeconfig-claim
    task_extra_volume_mounts: |
      - name: awx-kubeconfig-volume
        mountPath: /runner/.kube
    ee_extra_volume_mounts: |
      - name: awx-kubeconfig-volume
        mountPath: /runner/.kube

customVolumes:
  projects:
    enabled: true
    hostPath: /data/projects
    size: 1Gi