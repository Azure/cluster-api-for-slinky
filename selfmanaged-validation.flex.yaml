# =============================================================================
# caps-val FLEX worker — validates the CAPZ VMSS-Flex mechanism reproducibly.
# =============================================================================
#
# Drop-in worker replacement for selfmanaged-validation.yaml when
# WORKER_MODE=flex (the orchestrator filters the base's caps-val-mp-0 MachinePool
# docs out and applies these instead). Reworks the Uniform MachinePool into a
# MachineDeployment whose AzureMachineTemplate sets virtualMachineScaleSetID ->
# a pre-created BYO Flexible VMSS (scripts/selfmanaged-2-flexvmss.sh with
# VMSS=caps-val-flex RG=rg-capz-mi-val). Exercises the SAME flex path caps-self
# uses (backported CAPZ `virtualMachineScaleSetID` field), but CPU-cheap:
# Standard_D2as_v5 / plain Canonical Ubuntu, no GPU/IB.
#
# Requires (already in place on the mgmt cluster): backported CAPZ serving
# AzureMachine(.Template).spec.virtualMachineScaleSetID (caps-self depends on it),
# and the empty Flex VMSS caps-val-flex (FD=1, zone 1).
#
# NOTE: no slurm compute taint here — this is a plain reproducibility run.
# =============================================================================
---
apiVersion: cluster.x-k8s.io/v1beta1
kind: MachineDeployment
metadata:
  name: caps-val-md-0
  namespace: default
spec:
  clusterName: caps-val
  replicas: 2
  selector:
    matchLabels:
      caps-val.worker: md-0
  template:
    metadata:
      labels:
        caps-val.worker: md-0
        # Reaches the Node via CAPI Machine->Node label sync (the mgmt cluster's
        # --additional-sync-machine-labels=.*slinky\.slurm\.net.* patch), so slurmd's
        # nodeSelector node-type=compute matches. Mirrors caps-self-md-0.
        slinky.slurm.net/node-type: compute
    spec:
      clusterName: caps-val
      version: v1.36.1
      # Must match the Flex VMSS / zone (1). CAPZ creates each worker VM in this
      # zone AND inside the Flex VMSS, co-locating them (one implicit avail set).
      failureDomain: "1"
      bootstrap:
        configRef:
          apiVersion: bootstrap.cluster.x-k8s.io/v1beta1
          kind: KubeadmConfigTemplate
          name: caps-val-md-0
      infrastructureRef:
        apiVersion: infrastructure.cluster.x-k8s.io/v1beta1
        kind: AzureMachineTemplate
        name: caps-val-md-0

---
apiVersion: infrastructure.cluster.x-k8s.io/v1beta1
kind: AzureMachineTemplate
metadata:
  name: caps-val-md-0
  namespace: default
spec:
  template:
    spec:
      # *** The flex mechanism under test ***: place every worker VM into the
      # pre-created Flexible VMSS. Immutable; CAPZ sets availabilitySet=null when
      # present. Created by scripts/selfmanaged-2-flexvmss.sh (VMSS=caps-val-flex,
      # RG=rg-capz-mi-val).
      virtualMachineScaleSetID: /subscriptions/d2c9544f-4329-4642-b73d-020e7fef844f/resourceGroups/rg-capz-mi-val/providers/Microsoft.Compute/virtualMachineScaleSets/caps-val-flex
      identity: UserAssigned
      userAssignedIdentities:
        - providerID: azure:///subscriptions/d2c9544f-4329-4642-b73d-020e7fef844f/resourceGroups/rg-capz-mi-dev2/providers/Microsoft.ManagedIdentity/userAssignedIdentities/rg-capz-mi-dev2
      image:
        marketplace:
          publisher: Canonical
          offer: ubuntu-24_04-lts
          sku: server
          version: latest
      vmSize: Standard_D2as_v5
      osDisk:
        diskSizeGB: 64
        managedDisk:
          storageAccountType: Premium_LRS
        osType: Linux
      sshPublicKey: 
      additionalTags:
        Owner: t-hernandezc
        AzSecPackAutoConfigReady: "true"

---
apiVersion: bootstrap.cluster.x-k8s.io/v1beta1
kind: KubeadmConfigTemplate
metadata:
  name: caps-val-md-0
  namespace: default
spec:
  template:
    spec:
      files:
        - contentFrom:
            secret:
              # MachineDeployment workers: CAPZ generates one cloud-provider
              # azure.json secret named "<md-name>-azure-json".
              name: caps-val-md-0-azure-json
              key: worker-node-azure.json
          owner: root:root
          path: /etc/kubernetes/azure.json
          permissions: "0644"
      preKubeadmCommands:
        - set -eux
        - export DEBIAN_FRONTEND=noninteractive
        - apt-get -o DPkg::Lock::Timeout=600 update -y
        - apt-get -o DPkg::Lock::Timeout=600 install -y apt-transport-https ca-certificates curl gpg
        - command -v containerd >/dev/null 2>&1 || apt-get -o DPkg::Lock::Timeout=600 install -y containerd
        - mkdir -p /etc/containerd
        - containerd config default > /etc/containerd/config.toml
        - sed -ri 's/SystemdCgroup = false/SystemdCgroup = true/' /etc/containerd/config.toml
        - systemctl restart containerd
        - systemctl enable containerd
        - modprobe overlay
        - modprobe br_netfilter
        - printf 'overlay\nbr_netfilter\n' > /etc/modules-load.d/k8s.conf
        - printf 'net.bridge.bridge-nf-call-iptables=1\nnet.bridge.bridge-nf-call-ip6tables=1\nnet.ipv4.ip_forward=1\n' > /etc/sysctl.d/k8s.conf
        - sysctl --system
        - swapoff -a
        - sed -ri '/\sswap\s/s/^/#/' /etc/fstab
        - mkdir -p /etc/apt/keyrings
        - curl -fsSL https://pkgs.k8s.io/core:/stable:/v1.36/deb/Release.key | gpg --dearmor -o /etc/apt/keyrings/kubernetes-apt-keyring.gpg
        - echo 'deb [signed-by=/etc/apt/keyrings/kubernetes-apt-keyring.gpg] https://pkgs.k8s.io/core:/stable:/v1.36/deb/ /' > /etc/apt/sources.list.d/kubernetes.list
        - apt-get -o DPkg::Lock::Timeout=600 update -y
        - apt-get -o DPkg::Lock::Timeout=600 install -y kubelet=1.36.1-1.1 kubeadm=1.36.1-1.1 kubectl=1.36.1-1.1
        - apt-mark hold kubelet kubeadm kubectl
        - systemctl enable kubelet
      joinConfiguration:
        nodeRegistration:
          name: '{{ ds.meta_data["local_hostname"] }}'
          kubeletExtraArgs:
            cloud-provider: external
          # Dedicate compute nodes to Slurm (mirrors caps-self-md-0): repel pods
          # that don't tolerate it. slurmd tolerates it via the slurm values;
          # platform DaemonSets (kube-proxy/calico/cloud-node-manager) tolerate
          # all NoSchedule so they still run here.
          taints:
            - key: slinky.slurm.net/compute
              effect: NoSchedule

# =============================================================================
# In-cluster CONTROLLER MachineDeployment (caps-val-md-ctrl) — mirrors caps-self-
# md-ctrl. A non-GPU INDIVIDUAL VM (NO virtualMachineScaleSetID => not in the Flex
# VMSS; a controller node needs no IB co-location) labeled node-type=controller,
# to host slurmctld/slurmrestd (and, in production, Prometheus/Grafana) OFF the
# compute nodes. This makes the flex validation the faithful TWO-MachineDeployment
# topology (compute md-0 + controller md-ctrl).
# =============================================================================
---
apiVersion: cluster.x-k8s.io/v1beta1
kind: MachineDeployment
metadata:
  name: caps-val-md-ctrl
  namespace: default
spec:
  clusterName: caps-val
  replicas: 1
  selector:
    matchLabels:
      caps-val.worker: md-ctrl
  template:
    metadata:
      labels:
        caps-val.worker: md-ctrl
        # node-type=controller reaches the Node via the same CAPI label-sync patch;
        # the slurm values pin slurmctld/slurmrestd here.
        slinky.slurm.net/node-type: controller
    spec:
      clusterName: caps-val
      version: v1.36.1
      failureDomain: "1"
      bootstrap:
        configRef:
          apiVersion: bootstrap.cluster.x-k8s.io/v1beta1
          kind: KubeadmConfigTemplate
          name: caps-val-md-ctrl
      infrastructureRef:
        apiVersion: infrastructure.cluster.x-k8s.io/v1beta1
        kind: AzureMachineTemplate
        name: caps-val-md-ctrl

---
apiVersion: infrastructure.cluster.x-k8s.io/v1beta1
kind: AzureMachineTemplate
metadata:
  name: caps-val-md-ctrl
  namespace: default
spec:
  template:
    spec:
      # NO virtualMachineScaleSetID => CAPZ makes an INDIVIDUAL VM (not a VMSS
      # member). Non-GPU general-purpose; caps-self uses D8as_v5, D2as_v5 is fine
      # for the validation's slurmctld/slurmrestd.
      vmSize: Standard_D2as_v5
      image:
        marketplace:
          publisher: Canonical
          offer: ubuntu-24_04-lts
          sku: server
          version: latest
      osDisk:
        diskSizeGB: 64
        managedDisk:
          storageAccountType: Premium_LRS
        osType: Linux
      identity: UserAssigned
      userAssignedIdentities:
        - providerID: azure:///subscriptions/d2c9544f-4329-4642-b73d-020e7fef844f/resourceGroups/rg-capz-mi-dev2/providers/Microsoft.ManagedIdentity/userAssignedIdentities/rg-capz-mi-dev2
      sshPublicKey: 
      additionalTags:
        Owner: t-hernandezc
        AzSecPackAutoConfigReady: "true"

---
apiVersion: bootstrap.cluster.x-k8s.io/v1beta1
kind: KubeadmConfigTemplate
metadata:
  name: caps-val-md-ctrl
  namespace: default
spec:
  template:
    spec:
      files:
        - contentFrom:
            secret:
              name: caps-val-md-ctrl-azure-json
              key: worker-node-azure.json
          owner: root:root
          path: /etc/kubernetes/azure.json
          permissions: "0644"
      preKubeadmCommands:
        - set -eux
        - export DEBIAN_FRONTEND=noninteractive
        - apt-get -o DPkg::Lock::Timeout=600 update -y
        - apt-get -o DPkg::Lock::Timeout=600 install -y apt-transport-https ca-certificates curl gpg
        - command -v containerd >/dev/null 2>&1 || apt-get -o DPkg::Lock::Timeout=600 install -y containerd
        - mkdir -p /etc/containerd
        - containerd config default > /etc/containerd/config.toml
        - sed -ri 's/SystemdCgroup = false/SystemdCgroup = true/' /etc/containerd/config.toml
        - systemctl restart containerd
        - systemctl enable containerd
        - modprobe overlay
        - modprobe br_netfilter
        - printf 'overlay\nbr_netfilter\n' > /etc/modules-load.d/k8s.conf
        - printf 'net.bridge.bridge-nf-call-iptables=1\nnet.bridge.bridge-nf-call-ip6tables=1\nnet.ipv4.ip_forward=1\n' > /etc/sysctl.d/k8s.conf
        - sysctl --system
        - swapoff -a
        - sed -ri '/\sswap\s/s/^/#/' /etc/fstab
        - mkdir -p /etc/apt/keyrings
        - curl -fsSL https://pkgs.k8s.io/core:/stable:/v1.36/deb/Release.key | gpg --dearmor -o /etc/apt/keyrings/kubernetes-apt-keyring.gpg
        - echo 'deb [signed-by=/etc/apt/keyrings/kubernetes-apt-keyring.gpg] https://pkgs.k8s.io/core:/stable:/v1.36/deb/ /' > /etc/apt/sources.list.d/kubernetes.list
        - apt-get -o DPkg::Lock::Timeout=600 update -y
        - apt-get -o DPkg::Lock::Timeout=600 install -y kubelet=1.36.1-1.1 kubeadm=1.36.1-1.1 kubectl=1.36.1-1.1
        - apt-mark hold kubelet kubeadm kubectl
        - systemctl enable kubelet
      joinConfiguration:
        nodeRegistration:
          name: '{{ ds.meta_data["local_hostname"] }}'
          kubeletExtraArgs:
            cloud-provider: external
          # NO taint — this node hosts the in-cluster control-plane pods.
