# code: language=ansible
- name: Find all Cluster API nodes
  hosts: localhost
  connection: local
  gather_facts: false
  tasks:
    - name: Find all Cluster API nodes
      # find all kubernetes pods under the namespace "awx"
      kubernetes.core.k8s_info:
        kind: Pod
        namespace: awx
      register: pods
    - name: Display Pods
      ansible.builtin.debug:
        var: pods.resources
