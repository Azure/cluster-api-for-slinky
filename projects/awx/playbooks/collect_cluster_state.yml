- name: Collect CAPI and Slurm workload cluster state
  hosts: localhost
  connection: local
  gather_facts: false
  tasks:
    - name: Query CAPI machine inventory summary
      ansible.builtin.command:
        cmd: python ../inventory/capi_slurm_inventory.py --summary
        chdir: "{{ playbook_dir }}"
      changed_when: false
      register: capi_inventory_summary

    - name: Show CAPI machine inventory summary
      ansible.builtin.debug:
        var: capi_inventory_summary.stdout
