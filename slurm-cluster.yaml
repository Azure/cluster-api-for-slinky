configFiles:
  cgroup.conf: |
    CgroupPlugin=disabled
controller:
  metrics:
    enabled: true
    serviceMonitor:
      enabled: true
  podSpec:
    affinity:
      nodeAffinity:
        requiredDuringSchedulingIgnoredDuringExecution:
          nodeSelectorTerms:
          - matchExpressions:
            - key: "slinky.slurm.net/node-type"
              operator: In
              values:
              - "controller"
loginsets:
  slinky:
    enabled: true
    sssdConf: |
      [sssd]
      config_file_version = 2
      services = nss,pam
      domains = LOCAL

      [nss]
      filter_groups = root,slurm
      filter_users = root,slurm

      [pam]

      [domain/LOCAL]
      id_provider = files
      auth_provider = none
    podSpec:
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: "slinky.slurm.net/node-type"
                operator: In
                values:
                - "controller"
nodesets:
  slinky:
    podSpec:
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: "slinky.slurm.net/node-type"
                operator: In
                values:
                - "compute"
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
          - labelSelector:
              matchExpressions:
              - key: app.kubernetes.io/name
                operator: In
                values:
                - "slurmd"
            topologyKey: "kubernetes.io/hostname"
restapi:
  podSpec:
    affinity:
      nodeAffinity:
        requiredDuringSchedulingIgnoredDuringExecution:
          nodeSelectorTerms:
          - matchExpressions:
            - key: "slinky.slurm.net/node-type"
              operator: In
              values:
              - "controller"
