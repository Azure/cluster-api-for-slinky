configFiles:
  cgroup.conf: |
    CgroupPlugin=disabled
controller:
  logfile:
    image:
      repository: public.ecr.aws/docker/library/alpine
      tag: "3.21"
  metrics:
    enabled: true
    serviceMonitor:
      enabled: true
  podSpec:
    tolerations:
    - key: slinky.slurm.net/controller
      operator: Exists
      effect: NoSchedule
    affinity:
      nodeAffinity:
        requiredDuringSchedulingIgnoredDuringExecution:
          nodeSelectorTerms:
          - matchExpressions:
            - key: "slinky.slurm.net/node-type"
              operator: In
              values:
              - "controller"
loginsets:
  slinky:
    enabled: true
    initconf:
      image:
        repository: public.ecr.aws/docker/library/alpine
        tag: "3.21"
    sssdConf: |
      [sssd]
      config_file_version = 2
      services = nss,pam
      domains = LOCAL

      [nss]
      filter_groups = root,slurm
      filter_users = root,slurm

      [pam]

      [domain/LOCAL]
      id_provider = files
      auth_provider = none
    podSpec:
      tolerations:
      - key: slinky.slurm.net/controller
        operator: Exists
        effect: NoSchedule
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: "slinky.slurm.net/node-type"
                operator: In
                values:
                - "controller"
nodesets:
  slinky:
    logfile:
      image:
        repository: public.ecr.aws/docker/library/alpine
        tag: "3.21"
    podSpec:
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: "slinky.slurm.net/node-type"
                operator: In
                values:
                - "compute"
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
          - labelSelector:
              matchExpressions:
              - key: app.kubernetes.io/name
                operator: In
                values:
                - "slurmd"
            topologyKey: "kubernetes.io/hostname"
restapi:
  podSpec:
    tolerations:
    - key: slinky.slurm.net/controller
      operator: Exists
      effect: NoSchedule
    affinity:
      nodeAffinity:
        requiredDuringSchedulingIgnoredDuringExecution:
          nodeSelectorTerms:
          - matchExpressions:
            - key: "slinky.slurm.net/node-type"
              operator: In
              values:
              - "controller"
