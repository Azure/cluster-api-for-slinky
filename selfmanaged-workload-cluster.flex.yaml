# =============================================================================
# DRAFT (Phase 3) — VMSS-Flex worker stanza for cross-node InfiniBand RDMA.
#
# This is a DROP-IN REPLACEMENT for the worker block in
# selfmanaged-workload-cluster.yaml — i.e. the three resources named
# `caps-self-mp-0`: MachinePool + AzureMachinePool + KubeadmConfig.
#
# It reworks them into MachineDeployment + AzureMachineTemplate +
# KubeadmConfigTemplate (`caps-self-md-0`) and sets
#   AzureMachineTemplate.spec.template.spec.virtualMachineScaleSetID
# to the pre-created BYO VMSS Flex (scripts/create-vmss-flex-ib.sh). CAPZ (the
# backported v1.23.2 controller, scripts/deploy-capz-vmss-flex.sh) then creates
# each worker VM INSIDE that Flexible VMSS, which has a single fault domain in zone
# 1 (one implicit availability set) => both workers share ONE InfiniBand partition
# (matching pkeys) => UCX_TLS=rc cross-node RDMA works. (NB: do NOT add a PPG to the
# Flex VMSS — it conflicts with the implicit availability set; see the script.)
#
# Requires (must already be in place):
#   * backported CAPZ serving AzureMachine(.Template).spec.virtualMachineScaleSetID
#   * VMSS Flex `caps-self-flex` (Phase 2), FD=1, no PPG
#
# CUTOVER (DESTRUCTIVE — deletes both current workers + Slurm compute):
#   kubectl delete machinepool caps-self-mp-0            # cascades AzureMachinePool/VMSS/KubeadmConfig
#   kubectl delete azuremachinepool caps-self-mp-0 --ignore-not-found
#   kubectl delete kubeadmconfig    caps-self-mp-0 --ignore-not-found
#   kubectl apply -f selfmanaged-workload-cluster.flex.yaml
# Then re-label new nodes `slinky.slurm.net/node-type=compute` and re-run day2 if needed.
# =============================================================================
---
apiVersion: cluster.x-k8s.io/v1beta1
kind: MachineDeployment
metadata:
  name: caps-self-md-0
  namespace: default
spec:
  clusterName: caps-self
  # 2 workers for true cross-node InfiniBand (was MachinePool replicas: 2).
  replicas: 2
  selector:
    matchLabels:
      caps-self.worker: md-0
  template:
    metadata:
      labels:
        caps-self.worker: md-0
        # Reaches the Node via CAPI Machine->Node label sync (the same
        # --additional-sync-machine-labels patch caps-self-md-ctrl relies on), so
        # a RECREATED compute VM self-labels for slurmd's node-type=compute
        # nodeSelector instead of needing a manual `kubectl label`.
        slinky.slurm.net/node-type: compute
    spec:
      clusterName: caps-self
      version: v1.36.1
      # Single zone (string here, vs MachinePool's failureDomains list). Must match
      # the VMSS Flex / PPG zone (1). CAPZ creates each worker VM in this zone AND
      # inside the Flex VMSS, so they co-locate in one IB partition.
      failureDomain: "1"
      bootstrap:
        configRef:
          apiVersion: bootstrap.cluster.x-k8s.io/v1beta1
          kind: KubeadmConfigTemplate
          name: caps-self-md-0
      infrastructureRef:
        apiVersion: infrastructure.cluster.x-k8s.io/v1beta1
        kind: AzureMachineTemplate
        name: caps-self-md-0

---
apiVersion: infrastructure.cluster.x-k8s.io/v1beta1
kind: AzureMachineTemplate
metadata:
  name: caps-self-md-0
  namespace: default
spec:
  template:
    spec:
      # *** The whole point of this rework ***: place every worker VM into the
      # pre-created Flexible VMSS (single fault domain, zone 1 => one implicit
      # availability set => one IB partition). Immutable; CAPZ sets
      # availabilitySet=null when this is present. Created by
      # scripts/create-vmss-flex-ib.sh.
      virtualMachineScaleSetID: /subscriptions/d2c9544f-4329-4642-b73d-020e7fef844f/resourceGroups/RG-CAPZ-MI-SCUS/providers/Microsoft.Compute/virtualMachineScaleSets/caps-self-flex
      identity: UserAssigned
      userAssignedIdentities:
        - providerID: azure:///subscriptions/d2c9544f-4329-4642-b73d-020e7fef844f/resourceGroups/rg-capz-mi-dev2/providers/Microsoft.ManagedIdentity/userAssignedIdentities/rg-capz-mi-dev2
      # Same Azure "Ubuntu-HPC" V100 image as the MachinePool worker (HPC-X, OFED,
      # CUDA/NCCL, no k8s -> preKubeadmCommands install it). cloud-init MUST be on.
      image:
        marketplace:
          publisher: microsoft-dsvm
          offer: ubuntu-hpc
          sku: "2404-v100"
          version: 24.04.2026052501
      vmSize: Standard_ND40rs_v2
      osDisk:
        diskSizeGB: 128
        managedDisk:
          storageAccountType: Premium_LRS
        osType: Linux
      sshPublicKey: 
      additionalTags:
        Owner: t-hernandezc
        AzSecPackAutoConfigReady: "true"

---
apiVersion: bootstrap.cluster.x-k8s.io/v1beta1
kind: KubeadmConfigTemplate
metadata:
  name: caps-self-md-0
  namespace: default
spec:
  template:
    spec:
      files:
        - contentFrom:
            secret:
              # MachineDeployment workers: CAPZ generates one cloud-provider
              # azure.json secret named "<md-name>-azure-json" (vs the
              # MachinePool's "<pool>-azure-json").
              name: caps-self-md-0-azure-json
              key: worker-node-azure.json
          owner: root:root
          path: /etc/kubernetes/azure.json
          permissions: "0644"
      # Identical bootstrap to the MachinePool worker (ubuntu-hpc has no k8s).
      preKubeadmCommands:
        - set -eux
        - export DEBIAN_FRONTEND=noninteractive
        - apt-get -o DPkg::Lock::Timeout=600 update -y
        - apt-get -o DPkg::Lock::Timeout=600 install -y apt-transport-https ca-certificates curl gpg
        - command -v containerd >/dev/null 2>&1 || apt-get -o DPkg::Lock::Timeout=600 install -y containerd
        - mkdir -p /etc/containerd
        - containerd config default > /etc/containerd/config.toml
        - sed -ri 's/SystemdCgroup = false/SystemdCgroup = true/' /etc/containerd/config.toml
        - systemctl restart containerd
        - systemctl enable containerd
        - modprobe overlay
        - modprobe br_netfilter
        - printf 'overlay\nbr_netfilter\n' > /etc/modules-load.d/k8s.conf
        - printf 'net.bridge.bridge-nf-call-iptables=1\nnet.bridge.bridge-nf-call-ip6tables=1\nnet.ipv4.ip_forward=1\n' > /etc/sysctl.d/k8s.conf
        - sysctl --system
        - swapoff -a
        - sed -ri '/\sswap\s/s/^/#/' /etc/fstab
        - mkdir -p /etc/apt/keyrings
        - curl -fsSL https://pkgs.k8s.io/core:/stable:/v1.36/deb/Release.key | gpg --dearmor -o /etc/apt/keyrings/kubernetes-apt-keyring.gpg
        - echo 'deb [signed-by=/etc/apt/keyrings/kubernetes-apt-keyring.gpg] https://pkgs.k8s.io/core:/stable:/v1.36/deb/ /' > /etc/apt/sources.list.d/kubernetes.list
        - apt-get -o DPkg::Lock::Timeout=600 update -y
        - apt-get -o DPkg::Lock::Timeout=600 install -y kubelet=1.36.1-1.1 kubeadm=1.36.1-1.1 kubectl=1.36.1-1.1
        - apt-mark hold kubelet kubeadm kubectl
        - apt-mark hold containerd 2>/dev/null || apt-mark hold moby-containerd 2>/dev/null || true
        - systemctl enable kubelet
      joinConfiguration:
        nodeRegistration:
          name: '{{ ds.meta_data["local_hostname"] }}'
          kubeletExtraArgs:
            cloud-provider: external
          # COMPUTE-NODE TAINT (two-role split, 2026-07-02) — dedicate the
          # expensive ND40rs_v2 GPU/IB nodes to Slurm compute by repelling every
          # pod that does NOT explicitly tolerate it. slurmd tolerates it via
          # caps-self-slurm.yaml nodesets.slinky.podSpec.tolerations; the platform
          # DaemonSets (kube-proxy, calico-node, prometheus-node-exporter) tolerate
          # all NoSchedule, so they still run here.
          #
          # IMMUTABILITY: a KubeadmConfigTemplate edit does NOT re-bootstrap an
          # already-joined node — this taint only lands on FUTURE compute VMs. To
          # taint the 2 live workers now (non-destructive), run per node:
          #   kubectl taint node <compute-node> slinky.slurm.net/compute=:NoSchedule
          taints:
            - key: slinky.slurm.net/compute
              effect: NoSchedule

# =============================================================================
# In-cluster CONTROLLER MachineDeployment (`caps-self-md-ctrl`) — ADDITIVE.
#
# A dedicated NON-GPU worker that hosts the workload cluster's "control-plane
# stuff" — slurmctld, slurmrestd, and (when added) Prometheus/Grafana/KEDA/
# cert-manager etc. — so they stop squatting on the k8s control-plane node and
# stay OFF the costly GPU/IB compute nodes. The Kubernetes `KubeadmControlPlane`
# is unrelated and stays as-is; this is just an in-cluster workload node.
#
# This block is INDEPENDENT of the compute rework above and does NOT need the
# BYO Flex VMSS (a general-purpose VM needs no InfiniBand co-location), so there
# is NO `virtualMachineScaleSetID`. A MachineDeployment-backed AzureMachine
# creates an INDIVIDUAL VM (not a VMSS).
#
# NODE LABELING (decision 2a): the `slinky.slurm.net/node-type: controller` label
# below reaches the Kubernetes Node ONLY because the mgmt-cluster CAPI controller
# is patched to sync Slinky labels Machine -> Node. Apply ONCE on the mgmt cluster:
#   kubectl -n capi-system patch deployment/capi-controller-manager --type=json \
#     -p='[{"op":"add","path":"/spec/template/spec/containers/0/args/-",\
#          "value":"--additional-sync-machine-labels=.*slinky\\.slurm\\.net.*"}]'
#
# APPLY ORDER (non-destructive — nothing existing is deleted):
#   1. Patch capi-controller-manager (above).
#   2. kubectl apply -f selfmanaged-workload-cluster.flex.yaml  # creates this node
#   3. wait for the new node Ready; confirm it carries node-type=controller
#      (or label by hand if the patch was skipped).
#   4. helm upgrade slurm -f caps-self-slurm.yaml  # slurmctld/slurmrestd move here
#   5. taint the 2 live compute nodes (command above) so nothing else lands on them.
# =============================================================================
---
apiVersion: cluster.x-k8s.io/v1beta1
kind: MachineDeployment
metadata:
  name: caps-self-md-ctrl
  namespace: default
spec:
  clusterName: caps-self
  # Single always-on replica: minimal, persistent, local-path-friendly (its
  # storage is small and tolerant of the node staying put).
  replicas: 1
  selector:
    matchLabels:
      caps-self.worker: md-ctrl
  template:
    metadata:
      labels:
        caps-self.worker: md-ctrl
        # In-cluster controller role. Reaches the Node via CAPI Machine->Node
        # label sync (needs the --additional-sync-machine-labels patch; see header).
        slinky.slurm.net/node-type: controller
    spec:
      clusterName: caps-self
      version: v1.36.1
      # General-purpose D-series is zonal across 1/2/3 in SCUS; pin to zone 1 to
      # co-reside with the rest of the cluster in the same VNet/zone.
      failureDomain: "1"
      bootstrap:
        configRef:
          apiVersion: bootstrap.cluster.x-k8s.io/v1beta1
          kind: KubeadmConfigTemplate
          name: caps-self-md-ctrl
      infrastructureRef:
        apiVersion: infrastructure.cluster.x-k8s.io/v1beta1
        kind: AzureMachineTemplate
        name: caps-self-md-ctrl

---
apiVersion: infrastructure.cluster.x-k8s.io/v1beta1
kind: AzureMachineTemplate
metadata:
  name: caps-self-md-ctrl
  namespace: default
spec:
  template:
    spec:
      # Non-GPU general-purpose node. 8 vCPU / 32 GB comfortably fits slurmctld +
      # slurmrestd today and Prometheus/Grafana later without cutting corners.
      vmSize: Standard_D8as_v5
      # Plain Canonical Ubuntu 24.04 LTS (Gen2, amd64) — lean vs ubuntu-hpc, no
      # GPU/OFED bloat and NO marketplace plan required. Carries no Kubernetes, so
      # preKubeadmCommands install containerd + kubelet/kubeadm/kubectl (v1.36.1).
      image:
        marketplace:
          publisher: Canonical
          offer: ubuntu-24_04-lts
          sku: server
          version: latest
      osDisk:
        diskSizeGB: 128
        managedDisk:
          storageAccountType: Premium_LRS
        osType: Linux
      identity: UserAssigned
      userAssignedIdentities:
        - providerID: azure:///subscriptions/d2c9544f-4329-4642-b73d-020e7fef844f/resourceGroups/rg-capz-mi-dev2/providers/Microsoft.ManagedIdentity/userAssignedIdentities/rg-capz-mi-dev2
      sshPublicKey: 
      additionalTags:
        Owner: t-hernandezc
        AzSecPackAutoConfigReady: "true"

---
apiVersion: bootstrap.cluster.x-k8s.io/v1beta1
kind: KubeadmConfigTemplate
metadata:
  name: caps-self-md-ctrl
  namespace: default
spec:
  template:
    spec:
      files:
        - contentFrom:
            secret:
              # CAPZ generates one cloud-provider azure.json secret per MD named
              # "<md-name>-azure-json".
              name: caps-self-md-ctrl-azure-json
              key: worker-node-azure.json
          owner: root:root
          path: /etc/kubernetes/azure.json
          permissions: "0644"
      # Same worker bootstrap as caps-self-md-0. On plain Ubuntu the
      # `command -v containerd || apt-get install containerd` installs the distro
      # containerd (no moby-containerd conflict, unlike the HPC image).
      preKubeadmCommands:
        - set -eux
        - export DEBIAN_FRONTEND=noninteractive
        - apt-get -o DPkg::Lock::Timeout=600 update -y
        - apt-get -o DPkg::Lock::Timeout=600 install -y apt-transport-https ca-certificates curl gpg
        - command -v containerd >/dev/null 2>&1 || apt-get -o DPkg::Lock::Timeout=600 install -y containerd
        - mkdir -p /etc/containerd
        - containerd config default > /etc/containerd/config.toml
        - sed -ri 's/SystemdCgroup = false/SystemdCgroup = true/' /etc/containerd/config.toml
        - systemctl restart containerd
        - systemctl enable containerd
        - modprobe overlay
        - modprobe br_netfilter
        - printf 'overlay\nbr_netfilter\n' > /etc/modules-load.d/k8s.conf
        - printf 'net.bridge.bridge-nf-call-iptables=1\nnet.bridge.bridge-nf-call-ip6tables=1\nnet.ipv4.ip_forward=1\n' > /etc/sysctl.d/k8s.conf
        - sysctl --system
        - swapoff -a
        - sed -ri '/\sswap\s/s/^/#/' /etc/fstab
        - mkdir -p /etc/apt/keyrings
        - curl -fsSL https://pkgs.k8s.io/core:/stable:/v1.36/deb/Release.key | gpg --dearmor -o /etc/apt/keyrings/kubernetes-apt-keyring.gpg
        - echo 'deb [signed-by=/etc/apt/keyrings/kubernetes-apt-keyring.gpg] https://pkgs.k8s.io/core:/stable:/v1.36/deb/ /' > /etc/apt/sources.list.d/kubernetes.list
        - apt-get -o DPkg::Lock::Timeout=600 update -y
        - apt-get -o DPkg::Lock::Timeout=600 install -y kubelet=1.36.1-1.1 kubeadm=1.36.1-1.1 kubectl=1.36.1-1.1
        - apt-mark hold kubelet kubeadm kubectl
        - apt-mark hold containerd 2>/dev/null || apt-mark hold moby-containerd 2>/dev/null || true
        - systemctl enable kubelet
      joinConfiguration:
        nodeRegistration:
          name: '{{ ds.meta_data["local_hostname"] }}'
          kubeletExtraArgs:
            cloud-provider: external
          # NO taint here — this node is the intended scheduling target for the
          # in-cluster platform pods (slurmctld, slurmrestd, Prometheus, ...).
