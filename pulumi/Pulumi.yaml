name: ca4s-infra
description: |
  End-to-end Pulumi bootstrap for a Kind-backed management cluster. The resource
  graph is selected by top-level config plus local host discovery.

  Stack shape
  -----------
  ``main: __main__.py`` calls the shared Kind-backed outer stack builder:

    * no Azure IMDS capability/config → kind + ctlptl + Gitea bootstrap
    * Azure IMDS capability/config    → same bootstrap plus Azure identity and
      workload-cluster config

  Shared building blocks live in sibling packages:

    * ``ctlptl/``  — kind / cloud-provider-kind / local image registry
      dynamic resources
    * ``gitrepo/`` — GitOpsRepository ComponentResource contract +
      provider implementations (``gitea-builtin`` today; ``github``,
      ``gitlab`` to follow)

  Both packages are auto-importable because Pulumi adds the project root
  (``pulumi/``) to ``sys.path`` for the language host AND for every
  dynamic-Resource worker subprocess. No editable install, no
  ``sys.path`` shim, no ``PYTHONPATH`` wiring.

  Configuration lives in the active stack config file
  (for example ``Pulumi.local.yaml``, ``Pulumi.aks.yaml``, or
  ``Pulumi.azurebyo.yaml``). ``pulumi config
  set <key> <value> -s <stack>`` is the canonical way to populate them;
  they are NOT meant to be hand-edited as a primary workflow.
runtime:
  name: python
  options:
    # Reuse the repo-root .venv so we don't fragment Python environments.
    virtualenv: ../.venv

# Explicit (matches Pulumi's default). ``__main__.py`` calls the shared
# Kind-backed outer stack builder.
main: __main__.py

packages:
  awx:
    source: terraform-provider
    version: 1.1.3
    parameters:
      - registry.terraform.io/josh-silvas/awx
      - 1.8.0
  gitea:
    source: terraform-provider
    version: 1.1.3
    parameters:
      - go-gitea/gitea
  local:
    source: terraform-provider
    version: 1.1.3
    parameters:
      - hashicorp/local
