name: ca4s-workload-cluster
description: |
  Per-tenant workload-cluster stack — runs inside a PKO workspace pod
  out of ``pulumi/stacks/workload_cluster/`` of the seeded GitOps repo.

  ONE Pulumi STACK INSTANCE per tenant; each instance's stack name is
  ``<outer_env>-<tenant>`` (e.g. ``local-example``). The dispatcher
  in ``__main__.py`` splits that on the first ``-`` into ``outer_env``
  (selects the per-env module to import) and ``tenant`` (passed as a
  parameter to the module's ``run()``).

  Each instance produces:
    * On the management cluster: one CAPI ``Cluster`` + control-plane
      config + machine deployment (mirroring ``capi-quickstart.yaml``).
    * On the resulting workload cluster (kubeconfig fetched from the
      CAPI-published ``${cluster}-kubeconfig`` Secret on mgmt):
      ``slurm-operator-crds`` + ``slurm-operator`` + the Slurm chart +
      per-tenant ``NodeSet``s (mirroring ``slurm-cluster.yaml`` and
      ``slurm-operator-values.yaml``). Slinky CRDs live HERE, not on
      the management cluster.

  Stack CRs that drive this project are emitted by the PKO-owned
  ``ca4s-init`` stack via the per-env ``Tenants`` component (one CR per
  entry in the per-env concrete ``TenantsLocal`` / etc. class).
runtime:
  name: python
  options:
    virtualenv: ../../../.venv
main: __main__.py
