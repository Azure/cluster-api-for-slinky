name: ca4s-control-plane
description: |
  Management-cluster operators stack — runs inside a PKO workspace pod
  out of ``pulumi/stacks/control_plane/`` of the seeded GitOps repo.

  Installs the tenant-AGNOSTIC pieces: CAPI core + provider charts +
  AWX. Slinky CRDs + slurm-operator + Slurm chart are NOT installed
  here — they belong workload-cluster-side (see
  ``../workload_cluster/``). No ingress controller for now either:
  LoadBalancer Services on mgmt get a routable IP from the cloud
  provider (cloud-provider-kind locally) directly. The PKO-owned init stack
  waits for this Stack CR to become ready before instantiating tenant/workload
  resources, so CAPI + AWX land before any workload cluster is attempted.

  Same dispatcher pattern as the outer ``pulumi/`` project:
  ``main: __main__.py`` switches on ``pulumi.get_stack()`` (which
  reflects the third segment of PKO's ``spec.stack`` —
  ``organization/ca4s-control-plane/local`` → ``local``) and imports
  ``control_plane_<env>.py``. Adding ``azure`` etc. is purely additive.
runtime:
  name: python
  options:
    # Share the repo-root venv with the outer project and the other
    # two inner stacks. Three levels up from this directory.
    virtualenv: ../../../.venv
main: __main__.py
