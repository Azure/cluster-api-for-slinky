encryptionsalt: v1:VjgtcOTgSeI=:v1:Qk+1kfEEW+5Qj98l:26uVqeGXBdx4OW/LvLPHhaX3sPPb7Q==
config:
  ca4s-infra:builds:
    slurm-operator:
      builder: docker-image
      repositoryUrl: https://github.com/SlinkyProject/slurm-operator.git
      sourceRef: refs/pull/264/head
      imageName: slurm-operator
      target: manager
    slurm-operator-webhook:
      builder: docker-image
      repositoryUrl: https://github.com/SlinkyProject/slurm-operator.git
      sourceRef: refs/pull/264/head
      imageName: slurm-operator-webhook
      target: webhook
    slinky-charts:
      builder: slinky-charts
      repositoryUrl: https://github.com/SlinkyProject/slurm-operator.git
      sourceRef: refs/pull/264/head
    capz-controller:
      builder: docker-image
      repositoryUrl: https://github.com/kubernetes-sigs/cluster-api-provider-azure.git
      sourceRef: 69ec3a40a818ccbc32b8ce88c84609404d8cb7a2
      imageName: capz/cluster-api-azure-controller
      buildArgs:
        ARCH: amd64
    capz-provider:
      builder: capz-bundle
      repositoryUrl: https://github.com/kubernetes-sigs/cluster-api-provider-azure.git
      sourceRef: 69ec3a40a818ccbc32b8ce88c84609404d8cb7a2
  ca4s-infra:initStack:
    controlPlane:
      infrastructureProviders:
        azure:
          enabled: true
    tenants:
      workloadClusters:
        caps-aks:
          className: aks
          parameters:
            aks:
              nodeCount: 1