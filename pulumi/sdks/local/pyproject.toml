[project]
  name = "pulumi_local"
  description = "A Pulumi provider dynamically bridged from local."
  dependencies = ["parver>=0.2.1", "pulumi>=3.231.0,<4.0.0", "semver>=2.8.1", "typing-extensions>=4.11,<5; python_version < \"3.11\""]
  readme = "README.md"
  requires-python = ">=3.9"
  version = "2.9.0"
  [project.license]
    text = "MPL-2.0"
  [project.urls]
    Repository = "https://github.com/hashicorp/terraform-provider-local"

[build-system]
  requires = ["setuptools>=61.0"]
  build-backend = "setuptools.build_meta"

[tool]
  [tool.setuptools]
    [tool.setuptools.package-data]
      pulumi_local = ["py.typed", "pulumi-plugin.json"]
