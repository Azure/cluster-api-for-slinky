[project]
  name = "pulumi_gitea"
  description = "A Pulumi provider dynamically bridged from gitea."
  dependencies = ["parver>=0.2.1", "pulumi>=3.231.0,<4.0.0", "semver>=2.8.1", "typing-extensions>=4.11,<5; python_version < \"3.11\""]
  readme = "README.md"
  requires-python = ">=3.9"
  version = "0.7.0"
  [project.urls]
    Repository = "https://github.com/go-gitea/terraform-provider-gitea"

[build-system]
  requires = ["setuptools>=61.0"]
  build-backend = "setuptools.build_meta"

[tool]
  [tool.setuptools]
    [tool.setuptools.package-data]
      pulumi_gitea = ["py.typed", "pulumi-plugin.json"]
