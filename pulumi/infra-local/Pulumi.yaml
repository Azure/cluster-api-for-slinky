name: ca4s-infra-local
description: |
  Local management cluster + image registry, modeled as a Pulumi dynamic
  resource that wraps the `ctlptl` CLI. Replaces the imperative
  `ctlptl apply -f ctlptl.yaml` bootstrap step with a stateful, diffable,
  destroyable resource.
runtime:
  name: python
  options:
    # Reuse the repo-root .venv so we don't fragment Python environments.
    virtualenv: ../../.venv
