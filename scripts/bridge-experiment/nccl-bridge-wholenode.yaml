# =============================================================================
# nccl-bridge-wholenode.yaml — ROUTE A: run a real multi-node NCCL test THROUGH
# slurm-bridge on caps-self's GPU nodes, WHOLE-NODE PRIVILEGED (no device plugin,
# no Slurm GPU GRES). The bridge already allocates a whole node per pod, so we ask
# for the node (not `nvidia.com/gpu: N`) and reach the GPUs through the NVIDIA
# container runtime — sidestepping the two things caps-self doesn't have:
#   * the k8s NVIDIA device plugin (nodes do NOT advertise nvidia.com/gpu), and
#   * Slurm GPU GRES (gres.conf) — sinfo shows GRES=(null).
#
# This is the caps-self twin of cluster-api-provider-for-slinky/nccl-bridge-jobset.yaml
# (which uses the device-plugin `nvidia.com/gpu` = Route B). Differences for Route A
# on caps-self, from the verified live state (2026-07-13):
#   * NO `resources.limits.nvidia.com/gpu`  -> whole-node exclusive via the bridge.
#   * GPUs exposed by the NVIDIA container runtime via env, NOT the device plugin:
#       NVIDIA_VISIBLE_DEVICES=all + NVIDIA_DRIVER_CAPABILITIES=compute,utility
#     (the device plugin normally sets these; Route A sets them explicitly).
#   * nodeSelector = slinky.slurm.net/node-type=compute (caps-self's only GPU-node
#     label; there is NO nvidia.com/gpu.present label without the GPU operator).
#   * gang via PodGroup COSCHEDULING (scheduling.x-k8s.io/v1alpha1) — caps-self is
#     k8s 1.36 but the in-tree PodGroup needs the GenericWorkload gate (not enabled),
#     so coscheduling is the works-today path (installed by run.sh ensure_prereqs).
#
# ------------------------------------------------------------------------------
# PREREQUISITES on caps-self (Route A still needs a GPU *container runtime* + image;
# it only sidesteps the device plugin + GRES):
#   1. slurm-bridge installed:      scripts/azure-remote.sh bridge-experiment install
#   2. NVIDIA container runtime + `nvidia` RuntimeClass on the compute nodes
#      (e.g. `nvidia-container-toolkit` / the GPU-operator toolkit only — NO device
#      plugin, NO driver, since the ND40rs_v2 host already has the driver). Without
#      it `runtimeClassName: nvidia` is rejected and the container has no CUDA libs.
#   3. Image pull secret + a GPU/NCCL image reachable from caps-self:
#        kubectl -n slurm-bridge create secret docker-registry hpcimageacr-secret \
#          --docker-server=hpcimageacr.azurecr.io --docker-username=hpcimageacr \
#          --docker-password=<ACR_PASSWORD>
#   4. Passwordless-SSH secret for mpirun (mirrors benchmark_k8s_nccl.sh kubectl cp):
#        ssh-keygen -t rsa -N '' -f ./id_rsa && cp id_rsa.pub authorized_keys
#        kubectl -n slurm-bridge create secret generic nccl-ssh \
#          --from-file=id_rsa --from-file=id_rsa.pub --from-file=authorized_keys
#
# IMAGE REQUIREMENT (verified 2026-07-15 on caps-self V100s + driver 580 = CUDA 13):
# NCCL must be new enough for the host driver. The fleet cuda-nccl-test:12.1.1-2.18.5
# NCCL is TOO OLD -> every collective fails with "illegal memory access" (even single-
# GPU); the 13.0.2 tag can't target Volta (CUDA 13 dropped sm_70). VALIDATED image =
# nccl_2.20_good (NCCL 2.20.3 / CUDA 12.2, sm_70) + openssh: 10.1.2.6:5000/nccl_2.20_good:v1-ssh
#
# USAGE — apply with an EXPLICIT envsubst var list so the in-script shell variables
# ($HOSTS, $i, $JS, $SLOTS, $LAST) are NOT clobbered:
#   export IMAGE_NAME=10.1.2.6:5000/nccl_2.20_good:v1-ssh   # validated on V100 + driver 580
#   export NUM_NODES=2 NUM_WORKERS=1 NUM_DEVICES=8 NCCL_TEST=all_reduce_perf
#   envsubst '${IMAGE_NAME} ${NUM_NODES} ${NUM_WORKERS} ${NUM_DEVICES} ${NCCL_TEST}' \
#     < nccl-bridge-wholenode.yaml \
#     | sed '/imagePullSecrets:/d; /name: hpcimageacr-secret/d' | kubectl apply -f -
#   # NUM_NODES = total GPU nodes (gang size) = 1 launcher (rank 0) + NUM_WORKERS.
#   # NUM_DEVICES = GPUs/node — used ONLY for mpirun -np / --map-by (NOT a request).
# =============================================================================
---
# Gang: all NUM_NODES ranks are placed together or not at all (one Slurm job).
apiVersion: scheduling.x-k8s.io/v1alpha1
kind: PodGroup
metadata:
  name: nccl-bridge-wn
  namespace: slurm-bridge
spec:
  minMember: ${NUM_NODES}
---
apiVersion: jobset.x-k8s.io/v1alpha2
kind: JobSet
metadata:
  name: nccl-bridge-wn
  namespace: slurm-bridge
  annotations:
    slinky.slurm.net/job-name: nccl-bridge-wn
    slinky.slurm.net/timelimit: "30"
spec:
  # Stable per-pod DNS: <jobset>-<rjob>-<jobIndex>-0.<jobset> (used by mpirun --host).
  network:
    enableDNSHostnames: true
  # Benchmark is done when the launcher (rank 0) finishes; tear the workers down.
  successPolicy:
    operator: All
    targetReplicatedJobs:
      - launcher
  failurePolicy:
    maxRestarts: 0
  replicatedJobs:
    # --- rank 0: runs mpirun/NCCL across all ranks over pod DNS ------------------
    - name: launcher
      replicas: 1
      template:
        spec:
          backoffLimit: 0
          completions: 1
          parallelism: 1
          template:
            metadata:
              labels:
                # Join the gang so the launcher co-schedules with the workers.
                scheduling.x-k8s.io/pod-group: nccl-bridge-wn
            spec:
              restartPolicy: Never
              # NVIDIA container runtime (needs nvidia-container-toolkit on the node).
              runtimeClassName: nvidia
              # caps-self compute-node label (NOT nvidia.com/gpu.present).
              nodeSelector:
                slinky.slurm.net/node-type: compute
              # caps-self compute nodes carry slinky.slurm.net/compute:NoSchedule AS WELL
              # AS the bridge's managed-node:NoExecute. The bridge admission only injects
              # a toleration for managed-node, so the workload MUST tolerate compute too or
              # it stays Pending ("untolerated taint"). Verified on caps-self 2026-07-13.
              tolerations:
                - {key: slinky.slurm.net/compute, effect: NoSchedule, operator: Exists}
                - {key: slinky.slurm.net/managed-node, effect: NoExecute, operator: Exists}
              imagePullSecrets:
                - name: hpcimageacr-secret
              containers:
                - name: nccl-launcher
                  image: "${IMAGE_NAME}"
                  imagePullPolicy: IfNotPresent
                  securityContext:
                    privileged: true
                    capabilities:
                      add: ["IPC_LOCK"]
                  # ROUTE A: no device plugin -> tell the NVIDIA runtime to expose
                  # every GPU on the (whole, exclusively-allocated) node.
                  env:
                    - { name: NVIDIA_VISIBLE_DEVICES, value: "all" }
                    - { name: NVIDIA_DRIVER_CAPABILITIES, value: "compute,utility" }
                  command:
                    - /bin/bash
                    - -c
                    - |
                      set -eu
                      # SSH keys -> /root/.ssh with correct perms (mpirun uses ssh).
                      mkdir -p /root/.ssh && cp /etc/nccl-ssh/* /root/.ssh/
                      chmod 700 /root/.ssh && chmod 600 /root/.ssh/id_rsa
                      chmod 644 /root/.ssh/authorized_keys /root/.ssh/id_rsa.pub || true
                      printf 'StrictHostKeyChecking no\nUserKnownHostsFile /dev/null\n' > /root/.ssh/config
                      # Build the mpirun host list. OpenMPI/ORTE strips the DNS subdomain and
                      # ssh's to the SHORT name (unresolvable in k8s), so resolve each rank's
                      # JobSet DNS name to an IP and pass IPs to --host (as benchmark_k8s_nccl.sh
                      # does with scraped pod IPs).
                      JS=nccl-bridge-wn; SLOTS=${NUM_DEVICES}
                      # Own IP from the interface (self DNS lookup is flaky/racy in k8s).
                      myip=$(hostname -I 2>/dev/null | awk '{print $1}')
                      [ -z "$myip" ] && myip=$(getent hosts "${JS}-launcher-0-0.${JS}" | awk '{print $1}')
                      HOSTS="${myip}:$SLOTS"
                      LAST=$(( ${NUM_NODES} - 2 ))
                      # Wait for each worker's sshd (bash /dev/tcp; no nc dep), then resolve its IP.
                      for i in $(seq 0 "$LAST"); do
                        until (exec 3<>"/dev/tcp/${JS}-worker-$i-0.${JS}/22") 2>/dev/null; do
                          echo "[launcher] waiting for worker $i sshd..."; sleep 3; done
                        wip=$(getent hosts "${JS}-worker-$i-0.${JS}" | awk '{print $1}')
                        HOSTS="$HOSTS,${wip}:$SLOTS"
                      done
                      echo "[launcher] hosts: $HOSTS"
                      # Same NCCL-over-InfiniBand command as benchmark_k8s_nccl.sh.
                      exec mpirun --allow-run-as-root -np $(( ${NUM_NODES} * ${NUM_DEVICES} )) \
                        --host "$HOSTS" --map-by "ppr:${NUM_DEVICES}:node" \
                        -x UCX_TLS=rc -x UCX_IB_GID_INDEX=0 \
                        -x NCCL_IB_PCI_RELAXED_ORDERING=1 -x NCCL_SOCKET_IFNAME=eth0 \
                        -x NCCL_DEBUG=WARN -x NCCL_NET_GDR_LEVEL=5 \
                        "/opt/nccl-tests/build/${NCCL_TEST}" -b 8k -e 2G -f 2 -g 1 -n 20
                  volumeMounts:
                    - { name: dshm, mountPath: /dev/shm }
                    - { name: infiniband, mountPath: /dev/infiniband }
                    - { name: ms, mountPath: /opt/microsoft }
                    - { name: sshkey, mountPath: /etc/nccl-ssh, readOnly: true }
              volumes:
                - name: dshm
                  emptyDir: { medium: Memory, sizeLimit: 10Gi }
                - name: infiniband
                  hostPath: { path: /dev/infiniband, type: DirectoryOrCreate }
                - name: ms
                  hostPath: { path: /opt/microsoft, type: DirectoryOrCreate }
                - name: sshkey
                  secret: { secretName: nccl-ssh, defaultMode: 0600 }
    # --- ranks 1..N-1: GPU workers that just run sshd for mpirun ----------------
    - name: worker
      replicas: ${NUM_WORKERS}
      template:
        spec:
          backoffLimit: 0
          completions: 1
          parallelism: 1
          template:
            metadata:
              labels:
                scheduling.x-k8s.io/pod-group: nccl-bridge-wn
            spec:
              restartPolicy: Never
              runtimeClassName: nvidia
              nodeSelector:
                slinky.slurm.net/node-type: compute
              # Tolerate BOTH caps-self compute-node taints (see launcher note above).
              tolerations:
                - {key: slinky.slurm.net/compute, effect: NoSchedule, operator: Exists}
                - {key: slinky.slurm.net/managed-node, effect: NoExecute, operator: Exists}
              imagePullSecrets:
                - name: hpcimageacr-secret
              containers:
                - name: nccl-worker
                  image: "${IMAGE_NAME}"
                  imagePullPolicy: IfNotPresent
                  securityContext:
                    privileged: true
                    capabilities:
                      add: ["IPC_LOCK"]
                  env:
                    - { name: NVIDIA_VISIBLE_DEVICES, value: "all" }
                    - { name: NVIDIA_DRIVER_CAPABILITIES, value: "compute,utility" }
                  command:
                    - /bin/bash
                    - -c
                    - |
                      set -eu
                      mkdir -p /root/.ssh && cp /etc/nccl-ssh/* /root/.ssh/
                      chmod 700 /root/.ssh && chmod 600 /root/.ssh/id_rsa
                      chmod 644 /root/.ssh/authorized_keys /root/.ssh/id_rsa.pub || true
                      ssh-keygen -A 2>/dev/null || true
                      echo "[worker] sshd up; waiting for launcher"
                      exec /usr/sbin/sshd -D -e
                  volumeMounts:
                    - { name: dshm, mountPath: /dev/shm }
                    - { name: infiniband, mountPath: /dev/infiniband }
                    - { name: ms, mountPath: /opt/microsoft }
                    - { name: sshkey, mountPath: /etc/nccl-ssh, readOnly: true }
              volumes:
                - name: dshm
                  emptyDir: { medium: Memory, sizeLimit: 10Gi }
                - name: infiniband
                  hostPath: { path: /dev/infiniband, type: DirectoryOrCreate }
                - name: ms
                  hostPath: { path: /opt/microsoft, type: DirectoryOrCreate }
                - name: sshkey
                  secret: { secretName: nccl-ssh, defaultMode: 0600 }
