# DEPRECATED — do not use directly. The Pulumi bootstrap at pulumi/
# vendors its own ctlptl manifest. This file is scheduled for removal.
---
apiVersion: ctlptl.dev/v1alpha1
kind: Cluster
product: kind
name: ${CLUSTER_NAME}
registry: ${REGISTRY_NAME}
kindV1Alpha4Cluster:
  apiVersion: kind.x-k8s.io/v1alpha4
  kind: Cluster
  networking:
    ipFamily: dual
  nodes:
  - role: control-plane
    image: kindest/node:v1.36.1@sha256:3489c7674813ba5d8b1a9977baea8a6e553784dab7b84759d1014dbd78f7ebd5
    extraPortMappings:
    # Expose AWX service on localhost:32000 for local UI access.
    - containerPort: 32000
      hostPort: 32000
      listenAddress: "0.0.0.0"
      protocol: tcp
    extraMounts:
    # required by CAPD
    - hostPath: /var/run/docker.sock
      containerPath: /var/run/docker.sock
  - role: worker
    image: kindest/node:v1.36.1@sha256:3489c7674813ba5d8b1a9977baea8a6e553784dab7b84759d1014dbd78f7ebd5
    extraMounts:
    # uncomment the following only if you want to fix the "project from filesystem" feature of AWX (i.e. getting rid of Gitea)
    # - hostPath: ./projects
    #   containerPath: /data/projects
    # Exposes the host kubeconfig to in-cluster consumers via hostPath /root/.kube:
    #   - AWX / ansible-runner (mounted at /runner/.kube, see awx.yaml, pod-spec-override.yaml)
    #   - cluster-autoscaler   (mounted at /mnt/kubeconfig, see cluster-autoscaler.yaml)
    - hostPath: ${HOME}/.kube
      containerPath: /root/.kube
    # required by CAPD (capd-controller-manager may be scheduled on either kind node)
    - hostPath: /var/run/docker.sock
      containerPath: /var/run/docker.sock
