# Pins all kube-prometheus-stack components to the controller (head) node.
# IMPORTANT: prometheus-node-exporter is a DaemonSet and is intentionally NOT pinned
# so it scrapes every node (including compute). DaemonSet pods do not block
# cluster-autoscaler scale-in.

prometheus:
  prometheusSpec:
    serviceMonitorSelectorNilUsesHelmValues: false
    podMonitorSelectorNilUsesHelmValues: false
    nodeSelector:
      slinky.slurm.net/node-type: controller
    tolerations:
    - key: slinky.slurm.net/controller
      operator: Exists
      effect: NoSchedule

alertmanager:
  alertmanagerSpec:
    nodeSelector:
      slinky.slurm.net/node-type: controller
    tolerations:
    - key: slinky.slurm.net/controller
      operator: Exists
      effect: NoSchedule

prometheusOperator:
  nodeSelector:
    slinky.slurm.net/node-type: controller
  tolerations:
  - key: slinky.slurm.net/controller
    operator: Exists
    effect: NoSchedule
  admissionWebhooks:
    patch:
      nodeSelector:
        slinky.slurm.net/node-type: controller
      tolerations:
      - key: slinky.slurm.net/controller
        operator: Exists
        effect: NoSchedule

grafana:
  nodeSelector:
    slinky.slurm.net/node-type: controller
  tolerations:
  - key: slinky.slurm.net/controller
    operator: Exists
    effect: NoSchedule

kube-state-metrics:
  nodeSelector:
    slinky.slurm.net/node-type: controller
  tolerations:
  - key: slinky.slurm.net/controller
    operator: Exists
    effect: NoSchedule
